spring.application.name=HOSPITAL-GATEWAY
server.port=9191

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Distributed Tracing & Zipkin
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Actuator Endpoints
management.endpoints.web.exposure.include=*

# Properties-based routing (preserving /api prefix)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=patient-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=RewritePath=/api/patients(?<segment>/?.*), /patients$\\{segment}

spring.cloud.gateway.server.webflux.routes[2].id=appointment-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://APPOINTMENT-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/appointments/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=RewritePath=/api/appointments(?<segment>/?.*), /appointments$\\{segment}


# Part 2 service routes
spring.cloud.gateway.server.webflux.routes[3].id=doctor-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://DOCTOR-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/doctors/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=RewritePath=/api/doctors(?<segment>/?.*), /doctors$\{segment}

spring.cloud.gateway.server.webflux.routes[4].id=pharmacy-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://PHARMACY-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/pharmacy/orders,/api/pharmacy/orders/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=RewritePath=/api/pharmacy/orders(?<segment>/?.*), /orders$\{segment}

spring.cloud.gateway.server.webflux.routes[5].id=laboratory-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://LABORATORY-SERVICE
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/laboratory/orders,/api/laboratory/orders/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=RewritePath=/api/laboratory/orders(?<segment>/?.*), /orders$\{segment}

spring.cloud.gateway.server.webflux.routes[6].id=billing-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://BILLING-SERVICE
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/billing/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=RewritePath=/api/billing(?<segment>/?.*), /billing$\{segment}

spring.cloud.gateway.server.webflux.routes[7].id=notification-service
spring.cloud.gateway.server.webflux.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/notifications,/api/notifications/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=RewritePath=/api/notifications(?<segment>/?.*), /notifications$\{segment}

