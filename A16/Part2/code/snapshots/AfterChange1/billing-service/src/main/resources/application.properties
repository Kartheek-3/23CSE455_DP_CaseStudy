spring.application.name=BILLING-SERVICE
server.port=8087
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mydb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
management.endpoints.web.exposure.include=health,info

payments.api-url=${PAYMENTS_API_URL:http://localhost:9999/payments}
payments.api-token=${PAYMENTS_API_TOKEN:}
payments.simulate-failure=${PAYMENTS_SIMULATE_FAILURE:false}
