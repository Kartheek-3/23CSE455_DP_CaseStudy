# Shows the launcher's own discovery log, including why tests were filtered out.
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=CONFIG
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
java.util.logging.SimpleFormatter.format=[JUL %4$s] %5$s%n
.level=WARNING
org.junit.platform.launcher.core.EngineDiscoveryOrchestrator.level=CONFIG
org.junit.platform.launcher.listeners.ClassSummaryListener.level=INFO
